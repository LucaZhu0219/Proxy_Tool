# 规则名称: AppleServers
# 规则统计: 16

domain_suffix_set:
  - aaplimg.com
  - apple-cloudkit.com
  - apple-dns.net
  - apple-mapkit.com
  - apple.co
  - apple.news
  - appsto.re
  - cdn-apple.com
  - me.com
  - organicfruitapps.com
  - push-apple.com.akadns.net
  - guzzoni-apple-com.v.aaplimg.com
  - guzzoni.apple.com
  - guzzoni.smoot.apple.com
  - mask-api.fe.apple-dns.net
  - mask-api.icloud.com
  - mask.icloud.com
  - mask-t.apple-dns.net
  - mask.apple-dns.net
  - apple-relay.mask.apple-dns.net
  - apple-relay.apple.com
  - apple-relay.cloudflare.com
  - apple-relay.fastly-edge.com
  - cp4.cloudflare.com
  - gspe1-ssl.ls.apple.com
  - ls.apple.com
  - smoot.apple.com
  - apps.mzstatic.com
  - mask-h2.icloud.com

domain_regex_set:
  # match apple.com domains except Apple Music
  - ^(?!(?:music\.apple\.com)$)(?:.+\.)?apple\.com$
  # match itunes.apple.com domains except Apple Music streaming hosts
  - ^(?!(?:aod-ssl|aod|audio-ssl|audio|mvod|streamingaudio)\.itunes\.apple\.com$)(?:.+\.)?itunes\.com$
