# 规则名称: AppleServers
# 规则统计: 16

domain_suffix_set:
  - aaplimg.com
  - apple-cloudkit.com
  - apple-dns.net
  - apple-mapkit.com
  - apple.co
  - apple.news
  - appsto.re
  - cdn-apple.com
  - me.com
  - organicfruitapps.com
  - push-apple.com.akadns.net

domain_regex_set:
  # match apple.com domains except Apple Music
  - ^(?!(?:music\.apple\.com)$)(?:.+\.)?apple\.com$
  # match itunes.apple.com domains except Apple Music streaming hosts
  - ^(?!(?:aod-ssl|aod|audio-ssl|audio|mvod|streamingaudio)\.itunes\.apple\.com$)(?:.+\.)?itunes\.com$
